# Dormant until this repo has a GitHub remote and the secrets below are set
# (Settings → Secrets and variables → Actions). See README.md for the full
# checklist. FTP_SERVER/USERNAME/PASSWORD are IONOS hosting credentials;
# the PUBLIC_SHOPIFY_* secrets are optional and only needed once the store exists.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *' # hourly, per PROJECT_IMPLEMENTATION_PLAN.md §7's proposed default
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.PUBLIC_SHOPIFY_STORE_DOMAIN }}
          PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}

      - name: Deploy to IONOS via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /penandpaperlabs/
