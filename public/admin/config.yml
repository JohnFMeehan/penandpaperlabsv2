# Decap CMS config. backend: git-gateway needs a Netlify site (Identity + Git
# Gateway enabled) attached to this repo before it can authenticate — see
# README.md for the manual setup steps. Fields mirror the schema in
# src/content.config.ts; keep the two in sync if either changes.

backend:
  name: git-gateway
  branch: main
  # The admin page is served from penandpaperlabs.com, not the Netlify domain,
  # so the backend can't find Identity/Git Gateway on the current origin —
  # point it at the Netlify site explicitly (same reason as in index.html).
  identity_url: https://tranquil-meerkat-859b5a.netlify.app/.netlify/identity
  gateway_url: https://tranquil-meerkat-859b5a.netlify.app/.netlify/git

media_folder: "public/images/journal"
public_folder: "/images/journal"

collections:
  - name: "journal"
    label: "Journal"
    folder: "src/content/journal"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Print", "Paper", "Electronics", "Software", "Process", "Shop notes"]
      - { label: "Slug", name: "slug", widget: "string", hint: "Must match the filename and be URL-safe, e.g. desk-clock" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Author", name: "author", widget: "string", default: "John Meehan", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
