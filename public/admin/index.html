<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Admin — Pen &amp; Paper Labs</title>
  <!-- This admin page is served from the real site's domain, not from Netlify
       itself, so the Identity widget needs to be told explicitly which
       Netlify site's Identity service to talk to (it can't auto-detect that
       across domains). Update APIUrl if the Netlify site is ever recreated. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      // The widget auto-runs init() with NO options at DOMContentLoaded, which
      // resets APIUrl to the default (current origin). Our init must run after
      // that auto-init or it gets clobbered — the widget registered its
      // DOMContentLoaded listener first, so ours is guaranteed to fire later.
      const initIdentity = () => {
        window.netlifyIdentity.init({
          APIUrl: 'https://tranquil-meerkat-859b5a.netlify.app/.netlify/identity',
        });
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initIdentity);
      } else {
        initIdentity();
      }
      window.netlifyIdentity.on('init', (user) => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</head>
<body>
  <!-- Decap CMS calls crypto.randomUUID(), which Safari only added in 15.4.
       Polyfill it so the CMS still loads on older browsers. -->
  <script>
    if (window.crypto && !window.crypto.randomUUID) {
      window.crypto.randomUUID = function () {
        return ('10000000-1000-4000-8000-100000000000').replace(/[018]/g, function (c) {
          return (c ^ (window.crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16);
        });
      };
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
